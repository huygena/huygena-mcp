name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    # Same layout as ci.yml: pnpm-workspace.yaml links ../huygena-intake and ../huygena-verify,
    # so the sibling libraries are checked out at the versions package.json pins.
    defaults:
      run:
        working-directory: main
    steps:
      - uses: actions/checkout@v4
        with:
          path: main
      - name: Read pinned library versions
        id: pins
        run: |
          echo "intake=$(node -p "require('./package.json').dependencies['huygena-intake'].split('#')[1]")" >> "$GITHUB_OUTPUT"
          echo "verify=$(node -p "require('./package.json').dependencies['huygena-verify'].split('#')[1]")" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: huygena/huygena-intake
          ref: ${{ steps.pins.outputs.intake }}
          path: huygena-intake
      - uses: actions/checkout@v4
        with:
          repository: huygena/huygena-verify
          ref: ${{ steps.pins.outputs.verify }}
          path: huygena-verify
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: main/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build huygena-intake
        working-directory: huygena-intake
        run: pnpm install --frozen-lockfile && pnpm build
      - name: Build huygena-verify
        working-directory: huygena-verify
        run: pnpm install --frozen-lockfile && pnpm build
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Check the tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: pnpm pack
      - name: Release notes from CHANGELOG.md
        run: awk -v t="## $GITHUB_REF_NAME" 'index($0,t)==1{f=1;next} /^## /{f=0} f' CHANGELOG.md > notes.md
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" huygena-mcp-*.tgz --title "huygena-mcp $GITHUB_REF_NAME" --notes-file notes.md --verify-tag
